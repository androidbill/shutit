name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell every open device straight away: the app watches this one value.
      - name: Publish the version for live clients
        run: |
          VERSION=$(grep -oE "APP_VERSION = '[^']+'" public/version.js | grep -oE "[0-9][0-9.]+")
          echo "publishing $VERSION"
          printf '"%s"' "$VERSION" > version.json
          curl -sS -X PUT --data @version.json -w 'rtdb: %{http_code}' "https://shut-it-4172-default-rtdb.firebaseio.com/meta/version.json"
